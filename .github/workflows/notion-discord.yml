name: Notion vers Discord

on:
  schedule:
    - cron: "*/5 * * * *"   # toutes les 5 min (GitHub peut avoir quelques minutes de retard)
  workflow_dispatch:         # bouton "Run workflow" pour lancer à la main
    inputs:
      test:
        description: "Mode test : renvoie la dernière tâche validée de chaque base"
        type: boolean
        default: false

concurrency:
  group: notion-discord
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # state.json = ce qui a déjà été envoyé, gardé d'une exécution à l'autre
      - name: Récupérer l'état
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Vérifier Notion
        env:
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}
        run: python notion_discord.py ${{ inputs.test && '--test' || '--once' }}

      - name: Sauvegarder l'état
        if: always() && hashFiles('state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}-${{ github.run_attempt }}
